spring.application.name=springboot_jdbc_01
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.project-ref.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
